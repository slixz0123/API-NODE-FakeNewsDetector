# ===============================
# = DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/fakenewsdb
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# = JWT
# ===============================
jwt.secret=8746fcdb1e2f48c7b9a6d3a54efb65ea417c2dbe4c6a7e54be7d9fc13d5cbd2a
jwt.expiration=36000 # 10 horas

# ===============================
# = MODEL CONFIG
# ===============================
model.service.url=http://localhost:8000
python.scripts.path=src/main/python-scripts/python-scripts

# ===============================
# = ENVIRONMENT
# ===============================
spring.profiles.active=dev

# ===============================
# = CORS
# ===============================
cors.allowed-origins=http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ===============================
# = LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.file.name=logs/app.log